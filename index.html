<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - Site Not Found</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #080306;
      color: #f8fafc;
      height: 100vh; height: 100dvh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }

    .error-card {
      background: rgba(18, 7, 15, 0.92);
      border: 1px solid rgba(255, 42, 84, 0.2);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 400px; width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .error-code {
      font-size: 3rem;
      font-weight: 700;
      color: #ff2a54;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.2rem;
      color: #ffb3c1;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="error-code">404</div>
    <h1>This site can’t be reached</h1>
    <p>The private realm or domain you are trying to access no longer exists and has been permanently taken offline.</p>
  </div>

</body>
</html>
